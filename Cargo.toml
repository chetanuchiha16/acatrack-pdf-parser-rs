[package]
name = "acatrack_rust"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust PDF parser for AcaTrack, bridged to Python via PyO3"

[lib]
name = "acatrack_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
rayon = "1.10"
regex = "1.11"
pdfsink-rs = "0.2"
once_cell = "1.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
